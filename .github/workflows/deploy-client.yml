name: Build and Deploy with Manual Approvals

on:
  push:
    branches:
      - dev
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      build-path: ./client/dist

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd client
          npm install

      - name: Build project
        run: |
          cd client
          if [ "${{ github.ref }}" == "refs/heads/dev" ]; then
            npm run build:dev
          else
            npm run build:prod
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: client/dist

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://RahamimLazimi.github.io/support-dashboard/dev/
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: ./client/dist

      - name: Deploy to GitHub Pages (dev)
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.PAT_TOKEN }}
          publish_dir: ./client/dist
          publish_branch: gh-pages
          destination_dir: dev
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com


  deploy-prod:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://RahamimLazimi.github.io/support-dashboard/prod/
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: ./client/dist

      - name: Deploy to GitHub Pages (prod)
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.PAT_TOKEN }}
          publish_dir: ./client/dist
          publish_branch: gh-pages
          destination_dir: prod
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
